import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import java.util.zip.ZipFile
import java.util.zip.ZipEntry
import java.util.zip.ZipOutputStream
import java.io.FileOutputStream

def exposureUserdevFiles = [
        'exposure-common.mixins.json',
        'exposure-forge.mixins.json',
        'exposure-userdev.refmap.json'
]

def readClassInfo = { InputStream stream ->
    def input = new DataInputStream(new BufferedInputStream(stream))
    if (Integer.toUnsignedLong(input.readInt()) != 0xCAFEBABEL) {
        throw new GradleException('Invalid class file while generating Exposure userdev refmap')
    }
    input.readUnsignedShort()
    input.readUnsignedShort()
    int constantCount = input.readUnsignedShort()
    def constants = new Object[constantCount]
    def classNameIndices = [:]
    for (int index = 1; index < constantCount; index++) {
        int tag = input.readUnsignedByte()
        switch (tag) {
            case 1:
                constants[index] = input.readUTF()
                break
            case 3:
            case 4:
                input.skipNBytes(4)
                break
            case 5:
            case 6:
                input.skipNBytes(8)
                index++
                break
            case 7:
                classNameIndices[index] = input.readUnsignedShort()
                break
            case 8:
            case 16:
            case 19:
            case 20:
                input.skipNBytes(2)
                break
            case 9:
            case 10:
            case 11:
            case 12:
            case 17:
            case 18:
                input.skipNBytes(4)
                break
            case 15:
                input.skipNBytes(3)
                break
            default:
                throw new GradleException("Unsupported class constant tag ${tag}")
        }
    }

    input.skipNBytes(6)
    int interfaces = input.readUnsignedShort()
    input.skipNBytes(interfaces * 2L)

    def readMembers = {
        int count = input.readUnsignedShort()
        def members = [:]
        count.times {
            input.readUnsignedShort()
            String name = constants[input.readUnsignedShort()]
            String descriptor = constants[input.readUnsignedShort()]
            members[name] = descriptor
            int attributes = input.readUnsignedShort()
            attributes.times {
                input.readUnsignedShort()
                input.skipNBytes(Integer.toUnsignedLong(input.readInt()))
            }
        }
        members
    }

    def fields = readMembers()
    def methods = readMembers()
    def classes = classNameIndices.values().collect { constants[it] }.findAll { it instanceof String } as Set
    [strings: constants.findAll { it instanceof String } as Set, classes: classes, fields: fields, methods: methods]
}

tasks.register('generateExposureUserdevRefmap') {
    group = 'forgegradle runs'
    description = 'Generate the refmap omitted from the Exposure 1.9.21 Forge userdev artifact.'
    dependsOn tasks.named('compileJava'), tasks.named('processResources'), tasks.named('createSrgToMcp')

    def outputDir = layout.buildDirectory.dir('resources/main')
    def patchedJar = layout.buildDirectory.file("exposure-userdev/exposure-${project.exposure_version}-userdev.jar")
    inputs.property('exposureVersion', providers.gradleProperty('exposure_version'))
    inputs.file(layout.buildDirectory.file('createSrgToMcp/output.srg'))
    outputs.files(exposureUserdevFiles.collect { outputDir.map { dir -> dir.file(it) } })
    outputs.file(patchedJar)

    doLast {
        // Resolve the already mapped ForgeGradle artifact directly. Resolving
        // compileClasspath here would also force Forge's mapped jar to be
        // regenerated, which is unsafe while a dev client is running.
        File exposureCache = new File(gradle.gradleUserHomeDir,
                "caches/forge_gradle/deobf_dependencies/maven/modrinth/exposure")
        File exposureJar = exposureCache.exists()
                ? project.fileTree(exposureCache).files.find { file ->
                    file.name.contains("exposure-${project.exposure_version}_mapped") && file.name.endsWith('.jar')
                }
                : null
        if (exposureJar == null) {
            throw new GradleException("Exposure ${project.exposure_version} dependency jar was not resolved")
        }

        def methodsBySrg = [:].withDefault { [] }
        def fieldsBySrg = [:].withDefault { [] }
        layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.eachLine('UTF-8') { line ->
            def columns = line.trim().split(/\s+/)
            if (columns.length >= 5 && columns[0] == 'MD:') {
                String source = columns[1]
                String sourceOwner = source.substring(0, source.lastIndexOf('/'))
                String raw = source.substring(source.lastIndexOf('/') + 1)
                String target = columns[3]
                methodsBySrg["${sourceOwner}/${raw}${columns[2]}"] << [
                        sourceOwner: sourceOwner,
                        raw: raw,
                        descriptor: columns[2],
                        targetOwner: target.substring(0, target.lastIndexOf('/')),
                        targetName: target.substring(target.lastIndexOf('/') + 1),
                        targetDescriptor: columns[4]
                ]
                methodsBySrg[raw] << [
                        sourceOwner: sourceOwner,
                        raw: raw,
                        descriptor: columns[2],
                        targetOwner: target.substring(0, target.lastIndexOf('/')),
                        targetName: target.substring(target.lastIndexOf('/') + 1),
                        targetDescriptor: columns[4]
                ]
            } else if (columns.length >= 3 && columns[0] == 'FD:') {
                String source = columns[1]
                String sourceOwner = source.substring(0, source.lastIndexOf('/'))
                String raw = source.substring(source.lastIndexOf('/') + 1)
                String target = columns[2]
                fieldsBySrg["${sourceOwner}/${raw}"] << [
                        sourceOwner: sourceOwner,
                        raw: raw,
                        targetOwner: target.substring(0, target.lastIndexOf('/')),
                        targetName: target.substring(target.lastIndexOf('/') + 1)
                ]
                fieldsBySrg[raw] << [
                        sourceOwner: sourceOwner,
                        raw: raw,
                        targetOwner: target.substring(0, target.lastIndexOf('/')),
                        targetName: target.substring(target.lastIndexOf('/') + 1)
                ]
            }
        }

        def mappings = [:]
        def configs = [:]
        new ZipFile(exposureJar).withCloseable { zip ->
            ['exposure-common.mixins.json', 'exposure-forge.mixins.json'].each { configName ->
                def entry = zip.getEntry(configName)
                if (entry == null) throw new GradleException("${configName} is missing from ${exposureJar.name}")
                def config = new JsonSlurper().parse(zip.getInputStream(entry))
                config.refmap = 'exposure-userdev.refmap.json'
                configs[configName] = config

                String packagePath = config.package.replace('.', '/')
                def mixinNames = []
                ['mixins', 'client', 'server'].each { key ->
                    if (config[key] instanceof Collection) mixinNames.addAll(config[key])
                }
                mixinNames.each { mixinName ->
                    String mixinClass = "${packagePath}/${mixinName.replace('.', '/')}"
                    def classEntry = zip.getEntry("${mixinClass}.class")
                    if (classEntry == null) return
                    def info = readClassInfo(zip.getInputStream(classEntry))
                    def references = [:]
                    def srgNames = info.strings.collectMany { value ->
                        (value =~ /[mf]_\d+_/).collect { match -> match as String }
                    }.unique()

                    String mixinSimpleName = mixinName.substring(mixinName.lastIndexOf('.') + 1)
                            .replaceFirst(/Mixin$/, '')
                    def targetOwner = info.classes.find { owner ->
                        def simple = owner.substring(owner.lastIndexOf('/') + 1)
                        simple == mixinSimpleName || simple == "${mixinSimpleName}Impl"
                    }
                    def resolveMethod = { String raw, String descriptor, String ownerHint ->
                        def candidates = methodsBySrg[raw].findAll { candidate ->
                            !descriptor || candidate.descriptor == descriptor
                        }
                        if (ownerHint) {
                            def hinted = candidates.findAll { it.sourceOwner == ownerHint }
                            if (!hinted.isEmpty()) candidates = hinted
                        }
                        if (candidates.size() > 1) {
                            def byName = candidates.findAll {
                                it.sourceOwner.substring(it.sourceOwner.lastIndexOf('/') + 1) == mixinSimpleName
                            }
                            if (!byName.isEmpty()) candidates = byName
                        }
                        candidates.size() == 1 ? candidates[0] : null
                    }
                    def resolveField = { String raw, String ownerHint ->
                        def candidates = fieldsBySrg[raw]
                        if (ownerHint) {
                            def hinted = candidates.findAll { it.sourceOwner == ownerHint }
                            if (!hinted.isEmpty()) candidates = hinted
                        }
                        if (candidates.size() > 1) {
                            def byName = candidates.findAll {
                                it.sourceOwner.substring(it.sourceOwner.lastIndexOf('/') + 1) == mixinSimpleName
                            }
                            if (!byName.isEmpty()) candidates = byName
                        }
                        candidates.size() == 1 ? candidates[0] : null
                    }

                    srgNames.each { raw ->
                        info.strings.findAll { value -> value == raw || value.startsWith(raw + '(') }
                                .each { key ->
                                    String descriptor = key == raw ? null : key.substring(raw.length())
                                    def method = resolveMethod(raw, descriptor, targetOwner)
                                    if (method != null) {
                                        String target = "L${method.sourceOwner};${raw}${method.descriptor}"
                                        references[key] = target
                                    }
                                }
                        info.strings.findAll { value -> value.startsWith('L') && value.contains(";${raw}") }
                                .each { value ->
                                    def match = (value =~ /^L([^;]+);${java.util.regex.Pattern.quote(raw)}(.*)$/)
                                    if (!match.matches()) return
                                    String ownerHint = match.group(1)
                                    String suffix = match.group(2)
                                    def method = suffix.startsWith('(')
                                            ? resolveMethod(raw, suffix, ownerHint)
                                            : resolveField(raw, ownerHint)
                                    if (method != null) {
                                        String target = suffix.startsWith('(')
                                                ? "L${ownerHint};${raw}${method.descriptor}"
                                                : "L${ownerHint};${raw}"
                                        references[value] = target
                                    }
                                }
                        def method = resolveMethod(raw, null, targetOwner)
                        if (method != null && !references.containsKey(raw)) {
                            String owner = targetOwner ?: method.sourceOwner
                            references[raw] = "L${owner};${raw}${method.descriptor}"
                        }
                        def field = resolveField(raw, targetOwner)
                        if (field != null && !references.containsKey(raw)) {
                            String owner = targetOwner ?: field.sourceOwner
                            references[raw] = "L${owner};${raw}"
                        }
                    }
                    if (!references.isEmpty()) mappings[mixinClass] = references.sort()
                }
            }
        }

        File resources = outputDir.get().asFile
        resources.mkdirs()
        configs.each { name, config ->
            new File(resources, name).setText(JsonOutput.prettyPrint(JsonOutput.toJson(config)), 'UTF-8')
        }
        def refmap = [mappings: mappings.sort(), data: [searge: mappings.sort()]]
        new File(resources, 'exposure-userdev.refmap.json').setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(refmap)), 'UTF-8')

        File patchedJarFile = patchedJar.get().asFile
        patchedJarFile.parentFile.mkdirs()
        new ZipFile(exposureJar).withCloseable { input ->
            new ZipOutputStream(new FileOutputStream(patchedJarFile)).withCloseable { output ->
                input.entries().each { entry ->
                    if (entry.name == 'exposure-userdev.refmap.json') return
                    output.putNextEntry(new ZipEntry(entry.name))
                    if (configs.containsKey(entry.name)) {
                        output.write(JsonOutput.prettyPrint(JsonOutput.toJson(configs[entry.name])).getBytes('UTF-8'))
                    } else {
                        input.getInputStream(entry).withCloseable { stream -> stream.transferTo(output) }
                    }
                    output.closeEntry()
                }
                output.putNextEntry(new ZipEntry('exposure-userdev.refmap.json'))
                output.write(JsonOutput.prettyPrint(JsonOutput.toJson(refmap)).getBytes('UTF-8'))
                output.closeEntry()
            }
        }
        logger.lifecycle("Generated patched Exposure userdev jar and refmap for ${mappings.size()} mixins")
    }
}

tasks.matching { it.name in ['runClient', 'prepareRunClient', 'prepareRunClientCompile'] }.configureEach {
    dependsOn tasks.named('generateExposureUserdevRefmap')
}

tasks.named('jar').configure {
    exclude exposureUserdevFiles
}
tasks.named('jarJar').configure {
    exclude exposureUserdevFiles
}

// Keep the patched copy userdev-only. The published mod continues to resolve
// Exposure from the pack's external mod set.
project.dependencies.add('runtimeOnly', project.files(
        layout.buildDirectory.file("exposure-userdev/exposure-${project.exposure_version}-userdev.jar")))
